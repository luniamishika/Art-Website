name: Update gallery

on:
  push:
    paths:
      - "images/gallery/**"
      - "build-gallery.py"

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build-gallery.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add gallery pages for new images
